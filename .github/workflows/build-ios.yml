name: Build Unsigned iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build web bundle
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor and install iOS pods
        run: npx --no-install cap sync ios

      - name: Build unsigned iPhone release
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            build

      - name: Package unsigned IPA
        run: |
          app=build/DerivedData/Build/Products/Release-iphoneos/App.app
          test -f "$app/App"
          test -f "$app/public/index.html"
          test -f "$app/PrivacyInfo.xcprivacy"
          mkdir -p build/Payload
          ditto "$app" build/Payload/App.app
          cd build
          zip -qry SelfDiscipline-unsigned.ipa Payload
          unzip -tq SelfDiscipline-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SelfDiscipline-unsigned-ipa
          path: build/SelfDiscipline-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
